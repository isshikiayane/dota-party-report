<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dota 2 开黑档案</title>
  <style>
    :root{--bg:#090a0c;--panel:#111216;--line:#302b27;--text:#f3eee7;--muted:#9e9890;--red:#d54832;--gold:#d5ad66;--green:#78a889}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#321813 0,transparent 28%),radial-gradient(circle at 85% 85%,#252015 0,transparent 30%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(125deg,transparent 0 70px,#fff 71px,transparent 72px 140px)}
    main{width:min(940px,calc(100% - 32px));margin:auto;padding:64px 0;position:relative}.brand{display:flex;align-items:center;gap:16px;margin-bottom:42px}.mark{width:64px;height:64px;display:grid;place-items:center;filter:drop-shadow(0 0 22px #bd3b285f);flex:0 0 auto}.mark svg{display:block;width:100%;height:100%}.mark .logo-tile{fill:#c74632}.mark .logo-cut{fill:#160d0b}
    h1{font-size:clamp(30px,6vw,64px);line-height:1;margin:0;letter-spacing:-.04em}.lead{margin:12px 0 0;color:var(--muted);font-size:18px}.panel{background:linear-gradient(145deg,#161619dd,#0f1013ee);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,40px);box-shadow:0 26px 90px #0009;backdrop-filter:blur(16px)}
    .panel-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.panel h2{margin:0;font-size:22px}.counter{color:var(--gold);font-variant-numeric:tabular-nums}.rows{display:grid;gap:12px}.row{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center}.num{width:38px;height:38px;border:1px solid #4a3e33;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:700}
    input{width:100%;border:1px solid #38383d;background:#090a0d;color:var(--text);border-radius:12px;padding:14px 16px;font:inherit;outline:none;transition:.2s}input:focus{border-color:var(--red);box-shadow:0 0 0 3px #d5483222}button,a.action{border:0;border-radius:12px;padding:13px 18px;font:700 16px/1.3 inherit;cursor:pointer;text-decoration:none;text-align:center}.remove{padding:0;width:40px;height:40px;background:#201614;color:#b98478;font-size:22px}.remove:disabled{opacity:.25;cursor:not-allowed}
    .tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.add{background:#202126;color:#ddd}.primary{background:linear-gradient(135deg,#e45339,#a52c20);color:#fff;box-shadow:0 8px 28px #b62f2444}.secondary{background:#262117;color:#e2c588;border:1px solid #5e4d31!important}.refresh{display:flex;align-items:center;gap:8px;color:var(--muted);margin-top:20px;font-size:14px}.refresh input{width:auto;accent-color:var(--red)}
    .notice{margin-top:26px;padding:18px 20px;border-left:3px solid var(--gold);background:#17140f;color:#bdb4a6;border-radius:0 12px 12px 0}.notice strong{color:#eee3d0}.status{min-height:26px;margin-top:14px;color:#e28b78}.foot{margin-top:24px;color:#777;font-size:13px}code{color:#dbb96f}@media(max-width:620px){main{padding:34px 0}.brand{align-items:flex-start}.mark{width:48px;height:48px;flex:0 0 auto}.panel-head{display:block}.counter{margin-top:6px}.tools>*{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark"><svg viewBox="0 0 600 600" role="img" aria-label="Dota 2"><title>Dota 2</title><rect class="logo-tile" x="32" y="28.5" width="540" height="544" rx="24"/><path class="logo-cut" d="M95 145.5 149 115l361 306-36 86-113-26L95 145.5Z"/><path class="logo-cut" d="m458.3 90.2 61.7 46.8-8.7 75.4-132.1-101.9 79.1-20.3Z" transform="rotate(3.874 449.6 151.3)"/><path class="logo-cut" d="m84 466.6 16.7-93.6L228 482.8 131.6 506 84 466.6Z"/></svg></div><div><h1>Dota 2 开黑档案</h1><p class="lead">输入 2–5 个账号，看看这车人到底是在上分，还是在集体坐牢。</p></div></div>
    <section class="panel">
      <div class="panel-head"><div><h2>参战账号</h2><div style="color:var(--muted)">支持 Dota Account ID、Steam64 ID 或含数字 ID 的个人资料链接</div></div><div class="counter"><span id="count">2</span> / 5</div></div>
      <div class="rows" id="rows"></div>
      <div class="tools">
        <button class="add" id="add" type="button">＋ 添加一人</button>
        <button class="primary" id="view" type="button">生成开黑报告</button>
        <button class="secondary" id="export" type="button">下载单 HTML</button>
      </div>
      <label class="refresh"><input id="refresh" type="checkbox">忽略本地缓存，重新向 OpenDota 查询</label>
      <div class="status" id="status" role="alert"></div>
      <div class="notice"><strong>统计口径：</strong>本工具根据 OpenDota 可公开查询到的比赛，判断这些账号是否出现在同一场且同一阵营。这不等于 Valve 客户端里的官方“组队场次”，隐私设置、未解析比赛和旧比赛字段缺失都会造成差异；报告中会明确标注数据缺口。</div>
    </section>
    <div class="foot">数据只保存在运行本工具的电脑上。首次查询可能需要一两分钟，之后会使用本地缓存。</div>
  </main>
  <script>
    const rows=document.querySelector('#rows'),count=document.querySelector('#count'),statusEl=document.querySelector('#status');
    const initial=new URLSearchParams(location.search).get('ids')?.split(',').filter(Boolean).slice(0,5)||[];
    let values=initial.length>=2?initial:['',''];
    function draw(){rows.innerHTML='';values.forEach((value,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="num">${i+1}</div><input aria-label="第 ${i+1} 个账号" placeholder="例如：123456789" value="${String(value).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}"><button class="remove" type="button" aria-label="删除第 ${i+1} 个账号" ${values.length<=2?'disabled':''}>×</button>`;row.querySelector('input').addEventListener('input',e=>values[i]=e.target.value);row.querySelector('.remove').onclick=()=>{values.splice(i,1);draw()};rows.append(row)});count.textContent=values.length;document.querySelector('#add').disabled=values.length>=5}
    function target(path){const ids=values.map(v=>v.trim()).filter(Boolean);if(ids.length<2){statusEl.textContent='请至少填写两个账号。';return null}if(new Set(ids).size!==ids.length){statusEl.textContent='账号不能重复。';return null}statusEl.textContent='正在准备报告…';return `${path}?ids=${encodeURIComponent(ids.join(','))}${document.querySelector('#refresh').checked?'&refresh=1':''}`}
    document.querySelector('#add').onclick=()=>{if(values.length<5){values.push('');draw()}};
    document.querySelector('#view').onclick=()=>{const url=target('/report');if(url)location.href=url};
    document.querySelector('#export').onclick=()=>{const url=target('/export');if(url){location.href=url;setTimeout(()=>statusEl.textContent='下载已开始；查询较慢时请稍候。',500)}};
    draw();
  </script>
</body>
</html>
